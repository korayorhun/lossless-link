[package]
name = "lossless-link"
version = "0.1.0"
edition = "2021"
description = "Lossless, low-latency audio from Windows to AirPlay (RAOP) speakers"
license = "MIT"

[dependencies]
anyhow = "1"
fastrand = "2"
log = "0.4"
mdns-sd = "0.11"
rubato = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
windows-core = "0.58" # the #[interface] macro refers to it by name

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
